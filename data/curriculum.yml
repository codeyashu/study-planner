    - {title: Valid Sudoku (row/col/box sets), topic: arrays-hashing, minutes: 25, kind: practice, resource: 'https://neetcode.io'}
    - {title: Valid Palindrome + Two Sum II - Input Array Is Sorted, topic: two-pointers, minutes: 30, kind: practice, resource: 'https://neetcode.io'}
    - {title: '3Sum (sort + two pointers, skip duplicates)', topic: two-pointers, minutes: 25, kind: practice, resource: 'https://neetcode.io'}
    - {title: Container With Most Water (greedy pointer move proof), topic: two-pointers, minutes: 25, kind: practice, resource: 'https://neetcode.io'}
