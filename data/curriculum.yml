# Week-by-week curriculum (source for scripts/build_plan.py).
# Each normal week: 20 tasks with fixed per-track counts (agentic-ai 3, system-design 3, dsa 5,
# architecture 2, python 3, java-spring-ai 2, staff-skills 1, review 1). Light weeks keep counts, ~65% minutes.
# topic: plain slug from data/topics.yml (globally unique; resolved across tracks) or case-studies/<slug>.
meta: {start_date: 2026-09-26, week1_monday: 2026-09-28, timezone: Asia/Kolkata}
phases:
- id: 0
  name: Baseline
  weeks: [0]
  goal: Calibrate starting level and get the toolchain working so week 1 starts with building, not setup.
  gate: [Baseline SD mock scored with the rubric, 3 DSA mediums attempted with times logged, AI self-assessment scores + skip list written to docs/log/baseline.md, 'uv, Docker, Ollama and API keys verified with a smoke-test call']
- id: 1
  name: Foundations
  weeks: [1, 2, 3, 4]
  goal: Refresh modern Python/Java/LLM foundations and start the capstone with structured outputs, tools and workflow patterns.
  gate: [Capstone repo with FastAPI /triage returning validated structured output and a typed tool loop, Orchestrator-workers + evaluator-optimizer feature working with 10 golden examples, ADRs 001-004 written; AGENTS.md in capstone repo, 'Arrays/hashing, two pointers, sliding window, stack: 20+ problems solved', interview-1 mock scored >= 2.5/4 average on the rubric]
- id: 2
  name: RAG + Evals
  weeks: [5, 6, 7, 8]
  goal: 'Ship hybrid RAG with reranking and an eval-driven workflow: error analysis, aligned judges and CI gates with tracing.'
  gate: [Hybrid retrieval beats dense-only on the golden set (hit rate@5 reported), Failure taxonomy from >= 100 traces; LLM judge TPR/TNR >= 0.8 against hand labels, Eval job in CI failing on threshold regressions; Langfuse traces for every request, Design doc v1 reviewed; ADRs 005-008, interview-2 mock scored >= 2.75/4]
- id: 3
  name: Agents + Protocols
  weeks: [9, 10, 11, 12]
  goal: Build a durable LangGraph orchestrator with Pydantic AI sub-agents, MCP servers in Python and Spring AI, HITL and memory.
  gate: [LangGraph orchestrator survives kill/restart mid-run and resumes from checkpoint, HITL approval gates every side-effecting tool call, Python MCP server + Spring AI MCP server both called by the orchestrator over Streamable HTTP, Written multi-agent platform design + influence plan artifact, interview-3 mock scored >= 3/4]
- id: 4
  name: Production & AI Architecture
  weeks: [13, 14, 15, 16]
  goal: Make the capstone production-grade (guardrails, routing, cost, observability, SLOs) and produce Staff-level architecture/strategy artifacts.
  gate: [promptfoo OWASP agentic red-team suite in CI with no high-severity failures, Routing cuts cost per resolved incident >= 30% without eval regression, SLOs + burn-rate alerts + online evals live; C4 + ADRs 013-016, 'Strategy doc, tech-debt proposal and AI adoption plan written', interview-4 mock scored >= 3/4]
- id: 5
  name: Scale & Depth
  weeks: [17, 18, 19, 20]
  goal: 'Go deep: DSPy/GEPA, inference serving, fine-tuning trade-offs, advanced RAG, distributed consensus, free-threaded Python, JVM concurrency.'
  gate: [DSPy vs hand-prompt vs fine-tune ablation written with numbers, Self-hosted model serving experiment with cost/quality comparison, Gossip Glomers broadcast challenge passing; Raft explained in < 5 min, Mentoring plan + talk/blog draft done, interview-5 mock scored >= 3.25/4]
- id: 6
  name: Capstone + Interview Loop
  weeks: [21, 22, 23, 24]
  goal: Ship capstone v1.0 on Azure with write-ups, and run full interview loops until scores are consistently strong.
  gate: [Capstone deployed on Azure Container Apps + Foundry with passing smoke evals, '2 blog posts, README, demo video, arc42 doc and ADR set 001-024 published', STAR bank with 12+ stories, interview-6 mock scored >= 3.5/4 on every dimension]
- id: 7
  name: Buffer
  weeks: [25, 26]
  goal: Catch up on slipped work and pick a specialization for the next 6 months.
  gate: [No P0 task left incomplete in progress.yml, Specialization spike written up, Final retro + next-6-month plan published]
weeks:
- week: 0
  phase: 0
  theme: Baseline & environment
  light: true
  checkpoint: null
  project: Dev environment ready (uv, Docker, Ollama, API keys) + baseline scores recorded in docs/log/
  tasks:
    agentic-ai:
    - {title: 'Self-assessment quiz on LLM fundamentals/agents/RAG/evals (score 1-5 per topic) + env setup: uv, Docker, Ollama (pull a 7-8B model), OpenAI/Anthropic/Azure keys in a .env, smoke-test one call each', topic: llm-fundamentals, minutes: 90, kind: practice, resource: 'https://docs.astral.sh/uv/'}
    system-design:
    - {title: 'Baseline 60-min SD mock: design a URL shortener end-to-end (requirements, estimates, API, data, scale, failure); self-score with the rubric', topic: framework-and-estimation, minutes: 60, kind: practice, resource: 'https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction'}
    dsa:
    - {title: 'Baseline medium (timed 30 min, Python): Group Anagrams — note approach + complexity out loud', topic: approach-complexity, minutes: 30, kind: practice, resource: 'https://neetcode.io'}
    - {title: 'Baseline medium (timed 30 min): Longest Substring Without Repeating Characters — use collections/itertools idioms', topic: python-idioms, minutes: 30, kind: practice, resource: 'https://neetcode.io'}
    - {title: 'Baseline medium (timed 30 min): Number of Islands — then log all 3 baseline problems (time, pattern, solved?) in the NeetCode 250 tracker', topic: problem-tracker, minutes: 30, kind: practice, resource: 'https://neetcode.io'}
    architecture: []
    python:
    - {title: 'Tooling setup: uv python install 3.14 + 3.14t, ruff + ty + pre-commit in a scratch repo; confirm `uv run pytest` works', topic: modern-tooling, minutes: 30, kind: practice, resource: 'https://docs.astral.sh/uv/'}
    java-spring-ai: []
    staff-skills: []
    review:
    - {title: 'Write your goals (role, AI-architect portfolio, interview target date) + skip list from baseline scores into docs/log/baseline.md', topic: staff-archetypes, minutes: 30, kind: write}
- week: 1
  phase: 1
  theme: Agent patterns, structured outputs, SD framework
  light: false
  checkpoint: null
  project: 'Capstone repo skeleton: uv + FastAPI + Pydantic structured-output /triage endpoint'
  tasks:
    agentic-ai:
    - {title: 'Read Anthropic ''Building effective agents'' and map each pattern (chaining, routing, parallelisation, orchestrator-workers, evaluator-optimizer, agents) to an Agentic Ops Copilot use case', topic: agent-patterns, minutes: 60, kind: learn, resource: 'https://www.anthropic.com/engineering/building-effective-agents'}
    - {title: 'LLM fundamentals refresh: tokenisation, temperature/top-p, reasoning vs non-reasoning models — run one prompt on 2 hosted + 1 Ollama model and log tokens, latency, cost', topic: llm-fundamentals, minutes: 60, kind: practice, resource: 'https://github.com/chiphuyen/aie-book'}
    - {title: 'Capstone build: create repo (uv, ruff, ty, pre-commit, pytest), FastAPI app with lifespan + /health + /triage returning a Pydantic-validated IncidentTriage structured output', topic: prompting-structured-outputs, minutes: 120, kind: build, resource: 'https://ai.pydantic.dev/'}
    system-design:
    - {title: 'Hello Interview ''System Design in a Hurry'': rebuild your delivery framework (reqs → entities → API → HLD → deep dives) as a one-page checklist', topic: framework-and-estimation, minutes: 45, kind: learn, resource: 'https://www.hellointerview.com/learn/system-design/in-a-hurry/introduction'}
    - {title: 'Latency numbers + back-of-envelope drill: estimate QPS, storage and bandwidth for 3 prompts (URL shortener, chat, LLM triage API) in 15 min each', topic: scalability-fundamentals, minutes: 45, kind: practice}
    - {title: 'Written design: URL shortener at 100M URLs/month — ID generation, KV choice, cache, 301 vs 302, analytics pipeline; 2-page doc', topic: case-studies/url-shortener, minutes: 45, kind: write}
    dsa:
    - {title: Contains Duplicate + Valid Anagram (hash set / Counter), topic: arrays-hashing, minutes: 25, kind: practice, resource: 'https://neetcode.io'}
    - {title: Two Sum + Group Anagrams (hash map keyed by sorted tuple/count signature), topic: arrays-hashing, minutes: 30, kind: practice, resource: 'https://neetcode.io'}
    - {title: Top K Frequent Elements (bucket sort vs heap — state both complexities), topic: arrays-hashing, minutes: 25, kind: practice, resource: 'https://neetcode.io'}
    - {title: 'Product of Array Except Self (prefix/suffix, O(1) extra space)', topic: arrays-hashing, minutes: 25, kind: practice, resource: 'https://neetcode.io'}
    - {title: Longest Consecutive Sequence + Encode and Decode Strings, topic: arrays-hashing, minutes: 30, kind: practice, resource: 'https://neetcode.io'}
    architecture:
    - {title: 'Fundamentals of Software Architecture 2e ch1-2: laws of architecture, architecture characteristics; list top-5 characteristics for the capstone', topic: architect-role-tradeoffs, minutes: 45, kind: learn}
    - {title: 'Write ADR 001 for capstone: record architecture decisions using MADR template in docs/adr/', topic: adrs, minutes: 30, kind: write, resource: 'https://adr.github.io'}
    python:
    - {title: 'Rep: uv workspace + dependency groups; ruff rule set (I, UP, B, SIM) + ty in pre-commit on capstone', topic: modern-tooling, minutes: 20, kind: practice, resource: 'https://docs.astral.sh/uv/'}
    - {title: 'Rep: Pydantic v2 model_config (strict, frozen, extra=''forbid''), field_validator vs model_validator on IncidentTriage', topic: pydantic-v2, minutes: 20, kind: practice}
    - {title: 'Rep: FastAPI lifespan + dependency-injected settings (pydantic-settings) and httpx AsyncClient reuse', topic: fastapi-production, minutes: 20, kind: practice}
    java-spring-ai:
    - {title: 'Modern Java 21→25 tour: records, sealed interfaces, pattern matching for switch — model Incident/Severity as sealed hierarchy', topic: modern-java, minutes: 30, kind: learn, resource: 'https://openjdk.org/projects/jdk/25/'}
    - {title: 'Generate Spring Boot 4 / Java 25 project for the Java side of capstone (web, actuator, Spring AI starter); run /actuator/health', topic: spring-boot-4, minutes: 30, kind: build}
    staff-skills:
    - {title: 'Read StaffEng archetypes (Tech Lead, Architect, Solver, Right Hand) and note which work you already do', topic: staff-archetypes, minutes: 30, kind: learn, resource: 'https://staffeng.com/guides/staff-archetypes/'}
    review:
    - {title: 'Flashcards: 15 cards on agent patterns + latency numbers; explain-it-back the 6 BEA patterns in 5 min', topic: agent-patterns, minutes: 60, kind: review}
- week: 2
