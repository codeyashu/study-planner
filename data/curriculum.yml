    - {title: 'Capstone build: 3 typed tools (search_runbooks stub, get_service_status, create_ticket) with Pydantic arg schemas, error-as-result returns and a hand-rolled tool loop with max-steps', topic: tool-calling, minutes: 120, kind: build}
