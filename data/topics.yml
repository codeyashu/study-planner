# Topic contract — single source of truth for topic slugs.
# Page path: docs/tracks/<track>/<slug>.md   (case studies: docs/tracks/<track>/case-studies/<slug>.md)
# priority: P0 = must (core to goal), P1 = should, P2 = nice/specialist
# complexity: 1 (easy refresh) .. 5 (deep, multi-week)
# phase: roadmap phase where it is first scheduled (0..7)
# hours: total target effort incl. reading outside scheduled tasks and review hours; scheduled minutes may be lower
#        for areas the learner is already strong in (system design, Python).

