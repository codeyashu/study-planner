# Communication & English — weekly arc. build_plan.py expands each week into 7 daily 30-min tasks
# (20-min in light weeks / buffer weeks). Drill content lives in docs/tracks/communication/drills/week-NN.md
# and MUST follow the day types below, each day heading carrying an explicit id: `## Day 3 — Speaking {#day-3}`.
#
# Day types (fixed):
#   1 Mon  Grammar        (exercise: error correction / transformation, medium-high)
#   2 Tue  Vocabulary     (5 new words + collocations + cloze; table header "| Word | Part of speech | Meaning | Example |")
#   3 Wed  Speaking       (60-90 s structured prompt + pronunciation micro-drill + self-check)
#   4 Thu  Idioms & phrasal verbs (table header "| Expression | Meaning | Example |")
#   5 Fri  Writing        (rewrite/edit task with model answer)
#   6 Sat  Speaking record (2-min recorded talk + rubric + shadowing)
#   7 Sun  Soft skills + weekly review (scenario, 150-word written response, 20-item recap, self-score)
minutes: 30
light_minutes: 20
weeks:
  - {week: 0, phase: baseline, grammar: "Grammar diagnostic quiz (40 items)", vocab: "Vocabulary level check (60 words)", idiom: "Idioms recognition check", speaking: "Record a 2-minute self-introduction talk (baseline)", writing: "Write a 150-word status email (baseline)", soft: "Communication self-assessment"}
  - {week: 1, grammar: "Articles & determiners: a/the/zero", vocab: "Precision verbs for business (assess, mitigate, prioritise)", idiom: "Workplace basics: touch base, ballpark, on the same page", speaking: "Pace and deliberate pausing", writing: "Concise emails and subject lines (BLUF)", soft: "Active listening and clarifying questions"}
  - {week: 2, grammar: "Prepositions and collocations", vocab: "Word nuance: affect/impact/influence, ensure/assure/insure", idiom: "Progress and delay: behind schedule, move the needle", speaking: "Word stress and sentence rhythm", writing: "Clear status updates", soft: "Giving feedback with SBI (situation-behaviour-impact)"}
  - {week: 3, grammar: "Present perfect vs past simple, and time expressions", vocab: "Tech-leadership verbs: champion, unblock, de-risk", idiom: "Risk and uncertainty: in the pipeline, up in the air", speaking: "Intonation for emphasis and questions", writing: "Meeting notes and action items", soft: "Receiving feedback without defensiveness"}
  - {week: 4, grammar: "Conditionals and modals for hedging and softening", vocab: "Diplomatic and hedging language", idiom: "Negotiation: meet halfway, off the table", speaking: "Cutting filler words (um, like, you know)", writing: "Editing for concision: cut 30 percent", soft: "Disagreeing respectfully", checkpoint: "comm-1"}
  - {week: 5, grammar: "Sentence structure and parallelism", vocab: "Analytical words: consequently, whereas, mitigate, hinge on", idiom: "Strategy metaphors: low-hanging fruit, moving parts", speaking: "PREP and pyramid structure for answers", writing: "Writing a design-doc summary", soft: "Facilitating a meeting"}
  - {week: 6, light: true, grammar: "Punctuation and style: commas, dashes, semicolons", vocab: "Verb-noun collocations (make a case, raise a concern)", idiom: "Phrasal verbs in meetings: bring up, follow up, wrap up", speaking: "Shadowing practice 1", writing: "Tightening paragraphs", soft: "Storytelling basics: context, conflict, resolution"}
  - {week: 7, grammar: "Relative clauses and reported speech", vocab: "Persuasion words: compelling, tangible, rationale", idiom: "Teamwork: pull your weight, have each other's back", speaking: "Explaining technical ideas to non-technical people", writing: "Technical explanations with analogies", soft: "Influencing without authority"}
  - {week: 8, grammar: "Common errors of fluent speakers: uncountables, word order, false friends", vocab: "Review and 100-word check", idiom: "Idiom review and usage in speech", speaking: "Deliver a 5-minute presentation", writing: "Writing an RFC introduction", soft: "Handling tough questions", checkpoint: "comm-2"}
  - {week: 9, grammar: "Active vs passive voice, and when to use each", vocab: "Precision with numbers: roughly, approximately, marginally, materially", idiom: "Project phrasal verbs: roll out, scale up, sign off", speaking: "Question intonation and turn-taking", writing: "Blameless postmortem prose", soft: "De-escalating conflict"}
  - {week: 10, grammar: "Inversion and emphasis structures", vocab: "Strategy vocabulary: leverage, trajectory, headwinds", idiom: "Vision: north star, the big picture", speaking: "Storytelling with data", writing: "Writing engineering strategy", soft: "Negotiating trade-offs"}
  - {week: 11, grammar: "Advanced articles and the zero article with abstract nouns", vocab: "Register: formal vs informal, and switching", idiom: "Escalation phrasal verbs: flag up, push back, loop in", speaking: "Clarity on calls and video: pacing, signposting", writing: "Escalation emails", soft: "Saying no without burning bridges"}
  - {week: 12, light: true, grammar: "Linking words and cohesion", vocab: "Review, spaced repetition round", idiom: "Idiom review round", speaking: "Shadowing practice 2", writing: "Executive summaries", soft: "Cross-cultural communication", checkpoint: "comm-3"}
  - {week: 13, grammar: "Nominalisation vs strong verbs (clear writing)", vocab: "Executive vocabulary: mandate, remit, accountable", idiom: "Money talk: bottom line, cost a fortune, break even", speaking: "The 3-minute executive briefing", writing: "Executive updates", soft: "Stakeholder mapping and framing"}
  - {week: 14, grammar: "Degrees of certainty: modals and adverbs", vocab: "Negotiation vocabulary: concession, leverage, deadlock", idiom: "Negotiation phrasal verbs: hold out, give in, back down", speaking: "Handling pushback live", writing: "Writing a proposal", soft: "Negotiation practice"}
  - {week: 15, grammar: "Comparatives, quantifiers and precise comparisons", vocab: "Data storytelling vocabulary", idiom: "Data idioms: tip of the iceberg, moving target", speaking: "Narrating a demo", writing: "Tech-debt proposal", soft: "Difficult conversations"}
  - {week: 16, grammar: "Mixed error review (your personal error log)", vocab: "Review and 100-word check", idiom: "Idiom review round", speaking: "A 5-minute pitch", writing: "The one-pager", soft: "Executive presence", checkpoint: "comm-4"}
  - {week: 17, grammar: "Participle clauses and concise modification", vocab: "Intensifiers and nuance: considerably, notably, arguably", idiom: "Growth idioms: raise the bar, stretch goal", speaking: "Rhythm and stress in long sentences", writing: "Blog post outline", soft: "Mentoring conversations"}
  - {week: 18, light: true, grammar: "Review: hardest patterns from your error log", vocab: "Review, spaced repetition round", idiom: "Idiom review round", speaking: "Shadowing practice 3", writing: "Editing a colleague's draft", soft: "Giving upward feedback"}
  - {week: 19, grammar: "Rhetorical devices: contrast, triads, rhetorical questions", vocab: "Rhetoric and persuasion vocabulary", idiom: "Persuasion idioms: make the case, win over", speaking: "Persuasive talks", writing: "Blog post draft", soft: "Sponsoring and advocating for others"}
  - {week: 20, grammar: "Mixed advanced structures", vocab: "Review and 100-word check", idiom: "Idiom review round", speaking: "A 10-minute technical talk", writing: "Blog post final edit", soft: "Q&A under pressure", checkpoint: "comm-5"}
  - {week: 21, grammar: "Narrative tenses for stories about your past work", vocab: "Achievement verbs: spearheaded, orchestrated, streamlined", idiom: "Interview idioms: hit the ground running, go the extra mile", speaking: "Mock behavioural answers with STAR", writing: "Resume and profile bullet points", soft: "Self-advocacy without arrogance"}
  - {week: 22, grammar: "Precision under time pressure: fewer errors while thinking aloud", vocab: "Design-interview vocabulary: bottleneck, trade-off, blast radius", idiom: "Thinking-aloud phrases: let me walk through, to step back", speaking: "Narrating a system design out loud", writing: "Summary sections and profile", soft: "Handling ambiguity out loud"}
  - {week: 23, grammar: "Personal error log: final push", vocab: "Personal weak-word list", idiom: "Idiom review round", speaking: "Full mock loop speaking practice", writing: "Follow-up and thank-you emails", soft: "Building rapport quickly"}
  - {week: 24, grammar: "Final grammar assessment (compare with baseline)", vocab: "Final vocabulary check (compare with baseline)", idiom: "Idioms final check", speaking: "Record final talk (compare with baseline)", writing: "Write the baseline email again", soft: "Communication self-assessment (compare with baseline)", checkpoint: "comm-6"}
  - {week: 25, light: true, grammar: "Free choice: your weakest grammar area", vocab: "Free choice: your weakest vocabulary area", idiom: "Idiom review round", speaking: "Free choice: your weakest speaking area", writing: "Free choice: your weakest writing area", soft: "Free choice: your weakest soft skill"}
  - {week: 26, light: true, grammar: "Free choice: consolidate", vocab: "Free choice: consolidate", idiom: "Idiom review round", speaking: "Free choice: consolidate", writing: "Free choice: consolidate", soft: "Set your next 6-month communication goals"}
