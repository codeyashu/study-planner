name: Sync progress

# Ticking boxes / closing a "daily" issue syncs completed task ids into data/progress.yml.
on:
  issues:
    types: [closed, edited]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-writer
  cancel-in-progress: false

jobs:
  sync:
    if: contains(github.event.issue.labels.*.name, 'daily')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Sync + regenerate
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_DATE: ${{ github.event.issue.closed_at || github.event.issue.updated_at }}
        run: |
          uv run python scripts/sync_progress.py
          uv run python scripts/stats.py
          uv run python scripts/gen_today.py
      - name: Commit
        id: commit
        run: |
          git config user.name "study-bot"
          git config user.email "study-bot@users.noreply.github.com"
          git add data/progress.yml docs/assets/stats.json docs/today.md includes/today-snippet.md
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "progress: sync issue #${{ github.event.issue.number }}"
          git pull --rebase && git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
